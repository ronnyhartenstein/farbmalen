<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Farbmalen</title>
<meta name="description" content="Farbe gießen, zusehen wie sie zerläuft, darin herumrühren.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Referenz zum Ausmessen: ein echter Zentimeter auf diesem Bildschirm. -->
  <div id="cm-ruler" aria-hidden="true"></div>

  <canvas id="wanne"></canvas>

  <div id="werkzeuge" class="werkzeuge" role="toolbar" aria-label="Werkzeuge"></div>
  <div id="regler" class="regler"></div>

  <div class="unten">
    <p id="werkzeughinweis" class="werkzeughinweis"></p>
    <div id="fortschritt" class="fortschritt" hidden>
      <div id="fortschritt-fuellung" class="fortschritt-fuellung"></div>
      <span id="fortschritt-text" class="fortschritt-text"></span>
    </div>
    <div id="palette" class="palette" role="toolbar" aria-label="Farben"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="blitz" class="blitz" hidden></div>

  <div id="levelup" class="levelup" hidden>
    <div class="levelup-karte">
      <p class="levelup-ueberschrift">
        <span class="levelup-vor">Level</span>
        <span class="levelup-zahl" id="levelup-level"></span>
        <span class="levelup-vor">!</span>
      </p>
      <div id="levelup-werkzeug" class="levelup-werkzeug" hidden>
        <svg id="levelup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        <span id="levelup-werkzeugname"></span>
      </div>
      <p id="levelup-text" class="levelup-text"></p>
      <div id="levelup-farben" class="levelup-farben"></div>
      <button id="levelup-knopf" class="knopf levelup-knopf" type="button"></button>
    </div>
  </div>

  <div id="abzeichen" class="galerie abzeichen-overlay" hidden>
    <div class="galerie-kopf">
      <h2>Abzeichen</h2>
      <button id="abzeichen-zu" class="knopf knopf-text" type="button">Fertig</button>
    </div>
    <div class="abzeichen-spalten">
      <div class="abzeichen-spalte">
        <h3>Farbe <span id="abzeichen-farbe-gesamt"></span></h3>
        <ul id="abzeichen-farbe-liste" class="abzeichen-liste"></ul>
      </div>
      <div class="abzeichen-spalte">
        <h3>Wasser <span id="abzeichen-wasser-gesamt"></span></h3>
        <ul id="abzeichen-wasser-liste" class="abzeichen-liste"></ul>
      </div>
    </div>
  </div>

  <div id="galerie" class="galerie" hidden>
    <div class="galerie-kopf">
      <h2>Deine Abklatsche</h2>
      <button id="galerie-zu" class="knopf knopf-text" type="button">Fertig</button>
    </div>
    <div id="galerie-liste" class="galerie-liste"></div>
    <p id="galerie-leer" class="galerie-leer">Noch nichts abgeklatscht. Leg mal ein Papier auf!</p>
  </div>

  <div id="hinweis" class="hinweis" hidden>
    <h1>Oh je.</h1>
    <p id="hinweis-text"></p>
  </div>

  <div id="info-popover" class="info-popover" hidden></div>

  <div id="debug" class="debug" hidden></div>
  <div id="debug-stufen" class="debug-stufen" hidden></div>
  <div id="debug-abzeichen" class="debug-stufen" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
